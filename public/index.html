<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diky Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <header class="brand">
    <div class="logo">
      <span class="mark">D</span>
      <div>
        <h1>Diky Office</h1>
        <p>Stay chill, ship fast · live dari Claude Code</p>
      </div>
    </div>
    <div id="conn" data-ok="false"><i></i><span class="label">Menghubungkan…</span></div>
  </header>

  <nav class="actions">
    <button id="btn-demo" class="primary">▶ Putar demo</button>
    <button id="btn-center" title="Kembalikan kamera">⌖ Kamera</button>
    <button id="btn-reset" title="Kosongkan kantor">↺ Reset</button>
  </nav>

  <aside class="roster">
    <div class="roster-head">Tim <span id="roster-count">0</span></div>
    <div id="roster-list"></div>
  </aside>

  <aside id="panel">
    <button id="panel-close" aria-label="Tutup">✕</button>
    <div id="panel-body"></div>
  </aside>

  <footer class="ticker">
    <span class="live"><i></i>LIVE</span>
    <div id="feed"></div>
  </footer>

  <div id="empty">
    <div class="empty-card">
      <h2>Kantor masih sepi 😴</h2>
      <p>Jalankan <code>claude</code> di project yang sudah dipasang hook, dan agent-agentmu akan masuk lewat pintu.</p>
      <button id="empty-demo" class="primary">▶ Lihat demo dulu</button>
      <p class="hint">Pasang hook: <code>node install.js /path/ke/project</code></p>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
